name: release
# Continuous deployment from main: every push releases.
#  - If the push already bumped the version in package.json, that version is released.
#  - Otherwise the workflow bumps the patch version itself (bot commit on main), then releases.
#  - Each release = git tag + GitHub release with generated notes + npm publish (when NPM_TOKEN exists).
#  - Put "[skip release]" in the commit message to only run CI.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: pick the version to release
        id: v
        run: |
          current=$(node -p "require('./package.json').version")
          if git ls-remote --tags origin "refs/tags/v$current" | grep -q .; then
            next=$(node -p "const [a,b,c]='$current'.split('.').map(Number); [a,b,c+1].join('.')")
            echo "v$current already released; auto-bumping to v$next"
            npm run bump "$next"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -am "chore(release): v$next [skip release]"
            git push origin HEAD:main
            echo "version=$next" >> "$GITHUB_OUTPUT"
          else
            echo "version bumped in this push: v$current"
            echo "version=$current" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm run check
      - name: publish to npm (skipped until the NPM_TOKEN secret exists)
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: tag + GitHub release with generated notes
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ steps.v.outputs.sha }}
          generate_release_notes: true
