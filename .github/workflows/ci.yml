name: ci
on:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: committed dist/ and docs/ must match the build
        if: matrix.node == 22
        run: git diff --exit-code --stat -- dist docs || (echo "run npm run check and commit dist/ and docs/" && exit 1)
