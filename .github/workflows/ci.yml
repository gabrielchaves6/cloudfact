name: ci
on:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: dist/ e docs/ versionados precisam bater com o build
        if: matrix.node == 22
        run: git diff --exit-code --stat -- dist docs || (echo "rode npm run check e commite dist/ e docs/" && exit 1)
